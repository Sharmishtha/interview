name = "interview"
main = "worker/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# The built frontend. run_worker_first lets the password gate cover the page
# itself; without it Cloudflare would serve the HTML before the Worker runs.
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# ---------------------------------------------------------------------------
# Environments
# ---------------------------------------------------------------------------
#
# Two Workers, two sets of secrets, two hostnames. They share this file and
# nothing else: a key put on staging is not on production, and a bad deploy to
# staging cannot touch what is live.
#
# Every wrangler command below MUST name its environment. `wrangler deploy` with
# no --env deploys the top-level worker above, which is neither of these.
#
#   npm run deploy:staging     -> staging.getoutloud.ai
#   npm run deploy:prod        -> getoutloud.ai and www.getoutloud.ai
#
# Secrets are per environment and are never written here:
#   npx wrangler secret put ELEVENLABS_API_KEY --env staging
#   npx wrangler secret put ANTHROPIC_API_KEY  --env staging   # optional
#   npx wrangler secret put APP_PASSWORD       --env staging
#   ...and again with --env production, with a different password.

[env.staging]
name = "interview-staging"

# The paid second opinion is offered on staging and nowhere else. Anything but
# the exact string "on" leaves it off, so a typo fails closed.
[env.staging.vars]
SECOND_OPINION = "on"

[env.staging.assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[env.staging.routes]]
pattern = "staging.getoutloud.ai"
custom_domain = true

[env.production]
name = "interview-production"

# Deliberately off. Setting ANTHROPIC_API_KEY on production still lets the model
# score questions a candidate wrote for themselves; it does not put the paid
# panel in front of anyone. Flip to "on" and redeploy when you want to sell it.
[env.production.vars]
SECOND_OPINION = "off"

[env.production.assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[env.production.routes]]
pattern = "getoutloud.ai"
custom_domain = true

[[env.production.routes]]
pattern = "www.getoutloud.ai"
custom_domain = true
